services:
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
      - isolated_db_network

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - 8000:8000
    env_file:
          - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    depends_on:

      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - app_network
      - isolated_web_network

volumes:
  postgres_data:
networks:
  app_network:           # ОБЩАЯ сеть
    driver: bridge

  isolated_db_network:   # ИЗОЛИРОВАННАЯ сеть для БД
    driver: bridge

  isolated_web_network:  # ИЗОЛИРОВАННАЯ сеть для веб-приложения
    driver: bridge